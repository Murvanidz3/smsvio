name: smsvio

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-release-env: &release-env
  NODE_ENV: production
  APP_RELEASE: ${APP_RELEASE:?APP_RELEASE is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: smsvio
      POSTGRES_USER: smsvio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - private

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  migrate:
    <<: *hardened
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-migrate:${APP_RELEASE}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://smsvio:${POSTGRES_PASSWORD}@postgres:5432/smsvio
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
    tmpfs:
      - /tmp
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  api:
    <<: *hardened
    image: ${IMAGE_PREFIX}-api:${APP_RELEASE}
    environment:
      <<: *release-env
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DATABASE_URL: postgresql://smsvio:${POSTGRES_PASSWORD}@postgres:5432/smsvio
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY_HOPS: '1'
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?SITE_DOMAIN is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      EMAIL_MODE: ${EMAIL_MODE:-disabled}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    tmpfs:
      - /tmp
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
      - public

  worker:
    <<: *hardened
    image: ${IMAGE_PREFIX}-worker:${APP_RELEASE}
    environment:
      <<: *release-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    tmpfs:
      - /tmp
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - private
      - public

  web:
    <<: *hardened
    image: ${IMAGE_PREFIX}-web:${APP_RELEASE}
    environment:
      NODE_ENV: production
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signin').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - public

  caddy:
    <<: *hardened
    image: ${IMAGE_PREFIX}-caddy:${APP_RELEASE}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:8081/']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - public

networks:
  public: {}
  private:
    internal: true

volumes:
  postgres-data: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}

name: Load test

# Manual only. Starts the local Compose stack and never talks to production.
on:
  workflow_dispatch:

jobs:
  load:
    name: 100 messages per second for 10 minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Start the local stack
        run: |
          cp .env.example .env
          printf '\nORG_SENDS_PER_SECOND=2000\n' >> .env
          docker compose up --detach --build --quiet-pull --wait --wait-timeout 600

      - name: Send against Compose
        run: node scripts/load-test.mjs
        env:
          LOAD_BASE_URL: http://127.0.0.1:8080

      - name: Show service logs
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color --tail 120

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

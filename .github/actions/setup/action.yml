name: Set up toolchain
description: Installs the pinned Node.js and pnpm versions and the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version

    - name: Install pnpm from packageManager
      shell: bash
      run: |
        package_manager="$(node -p "require('./package.json').packageManager")"
        npm install --global --allow-scripts=pnpm "$package_manager"
        pnpm --version
        echo "PNPM_STORE=$(pnpm store path)" >>"$GITHUB_ENV"

    - name: Cache the pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
